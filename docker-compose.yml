services:
  db:
    image: postgres:16-alpine
    container_name: print-shop-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-printshop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-printshop}
    ports:
      # Loopback-only: production traffic reaches Postgres through the API, never directly.
      - '127.0.0.1:${POSTGRES_PORT:-15433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  # Catches all local mail (API: SMTP_HOST=localhost) — inbox at http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31.5
    container_name: print-shop-mailpit
    restart: unless-stopped
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'

volumes:
  pgdata:
