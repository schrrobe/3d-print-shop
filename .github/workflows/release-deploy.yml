name: Release & Deploy

# Every push to main builds images and deploys dev(.api).kaliberbox.de. Merging the
# release-please PR creates a release; that commit — already running on dev — is
# then promoted to kaliberbox.de / api.kaliberbox.de.
on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

concurrency:
  group: release-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/schrrobe

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release

  build-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: true
          tags: ${{ env.REGISTRY }}/kaliberbox-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Web image (dev)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: true
          build-args: SITE_URL=https://dev.kaliberbox.de
          tags: ${{ env.REGISTRY }}/kaliberbox-web:${{ github.sha }}-dev
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy-dev:
    needs: build-dev
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: https://dev.kaliberbox.de
    steps:
      - name: Deploy ${{ github.sha }} to dev
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s' "$GH_TOKEN" | ssh "kaliberbox@$DEPLOY_HOST" dev "$GITHUB_SHA"

  # Prod ships the exact API image that just went live on dev; only the web image
  # is rebuilt because Nuxt bakes the site URL in at build time.
  deploy-prod:
    needs: [release-please, deploy-dev]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://kaliberbox.de
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote API image
        run: docker buildx imagetools create -t "$REGISTRY/kaliberbox-api:$TAG" "$REGISTRY/kaliberbox-api:$GITHUB_SHA"
      - name: Web image (prod)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: true
          build-args: SITE_URL=https://kaliberbox.de
          tags: ${{ env.REGISTRY }}/kaliberbox-web:${{ env.TAG }}-prod
          cache-from: type=gha,scope=web
      - name: Deploy ${{ env.TAG }} to prod
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s' "$GH_TOKEN" | ssh "kaliberbox@$DEPLOY_HOST" prod "$TAG"
