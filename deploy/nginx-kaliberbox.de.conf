# /etc/nginx/sites-available/kaliberbox.de — prod: web 127.0.0.1:3100, api 127.0.0.1:3101
# Certificate: certbot certonly --webroot -w /var/www/certbot -d kaliberbox.de -d www.kaliberbox.de -d api.kaliberbox.de
# Needs /etc/nginx/snippets/proxy.conf and the $connection_upgrade map in conf.d (see /opt/README.md).
#
# The API has its own host. The shop host also forwards /api/ to it so the browser stays
# same-origin: first-party admin cookies, no CORS, helmet's same-origin resource policy.

server {
  listen 80;
  listen [::]:80;
  server_name kaliberbox.de www.kaliberbox.de api.kaliberbox.de;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name www.kaliberbox.de;
  ssl_certificate     /etc/letsencrypt/live/kaliberbox.de/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/kaliberbox.de/privkey.pem;
  return 301 https://kaliberbox.de$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name kaliberbox.de;
  ssl_certificate     /etc/letsencrypt/live/kaliberbox.de/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/kaliberbox.de/privkey.pem;
  add_header Strict-Transport-Security "max-age=31536000" always;
  client_max_body_size 60m;
  include /etc/nginx/snippets/proxy.conf;

  location /api/ { proxy_pass http://127.0.0.1:3101; }
  location /     { proxy_pass http://127.0.0.1:3100; }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name api.kaliberbox.de;
  ssl_certificate     /etc/letsencrypt/live/kaliberbox.de/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/kaliberbox.de/privkey.pem;
  add_header Strict-Transport-Security "max-age=31536000" always;
  client_max_body_size 60m;
  include /etc/nginx/snippets/proxy.conf;

  location / { proxy_pass http://127.0.0.1:3101; }
}
