# One compose project per environment (kaliberbox-prod, kaliberbox-dev) on the VPS.
# Driven by /usr/local/bin/kaliberbox-deploy; values come from /opt/kaliberbox/<env>/.env (api) and web.env (web):
#   STACK_ENV, IMAGE_TAG, WEB_PORT, API_PORT_PUBLISH, DB_PORT_PUBLISH, POSTGRES_PASSWORD, plus every app variable.
# Ports bind 127.0.0.1 only — a bare port mapping would let Docker bypass ufw.
name: kaliberbox-${STACK_ENV:?}

services:
  db:
    image: postgres:16-alpine
    container_name: kaliberbox-postgres-${STACK_ENV}
    restart: unless-stopped
    environment:
      POSTGRES_USER: kaliberbox
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: kaliberbox
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Loopback only: GUI clients reach it through an SSH tunnel to the VPS.
    ports:
      - '127.0.0.1:${DB_PORT_PUBLISH:?}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kaliberbox -d kaliberbox']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: ghcr.io/schrrobe/kaliberbox-api:${IMAGE_TAG:?}
    container_name: kaliberbox-api-${STACK_ENV}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://kaliberbox:${POSTGRES_PASSWORD}@db:5432/kaliberbox?schema=public
    volumes:
      - uploads:/data/uploads
      - invoices:/data/invoices
    ports:
      - '127.0.0.1:${API_PORT_PUBLISH:?}:3001'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s

  web:
    image: ghcr.io/schrrobe/kaliberbox-web:${IMAGE_TAG}-${STACK_ENV}
    container_name: kaliberbox-web-${STACK_ENV}
    restart: unless-stopped
    # Not .env: the web process needs no secrets, only NUXT_PUBLIC_* runtime overrides.
    env_file:
      - path: web.env
        required: false
    ports:
      - '127.0.0.1:${WEB_PORT:?}:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1),()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s

volumes:
  pgdata:
  uploads:
  invoices:
