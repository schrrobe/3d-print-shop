# /etc/nginx/sites-available/dev.kaliberbox.de — dev: web 127.0.0.1:3110, api 127.0.0.1:3111
# Certificate: certbot certonly --webroot -w /var/www/certbot -d dev.kaliberbox.de -d api.dev.kaliberbox.de
# Private (basic auth, /etc/nginx/kaliberbox-dev.htpasswd) except payment/e-mail webhooks.
# add_header lives at server level only, so no location drops HSTS or X-Robots-Tag.

server {
  listen 80;
  listen [::]:80;
  server_name dev.kaliberbox.de api.dev.kaliberbox.de;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name dev.kaliberbox.de;
  ssl_certificate     /etc/letsencrypt/live/dev.kaliberbox.de/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/dev.kaliberbox.de/privkey.pem;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Robots-Tag "noindex, nofollow" always;
  client_max_body_size 60m;
  include /etc/nginx/snippets/proxy.conf;
  auth_basic "kaliberbox dev";
  auth_basic_user_file /etc/nginx/kaliberbox-dev.htpasswd;

  location /api/webhooks/ { auth_basic off; proxy_pass http://127.0.0.1:3111; }
  location /api/          { proxy_pass http://127.0.0.1:3111; }
  location /              { proxy_pass http://127.0.0.1:3110; }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name api.dev.kaliberbox.de;
  ssl_certificate     /etc/letsencrypt/live/dev.kaliberbox.de/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/dev.kaliberbox.de/privkey.pem;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Robots-Tag "noindex, nofollow" always;
  client_max_body_size 60m;
  include /etc/nginx/snippets/proxy.conf;
  auth_basic "kaliberbox dev";
  auth_basic_user_file /etc/nginx/kaliberbox-dev.htpasswd;

  location /api/webhooks/ { auth_basic off; proxy_pass http://127.0.0.1:3111; }
  location /              { proxy_pass http://127.0.0.1:3111; }
}
